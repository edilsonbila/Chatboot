<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente de Farmácias - Moçambique</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chatbot-container">
        <div class="chat-header">
            <h1>Assistente de Farmácias</h1>
            <small id="location-status">A obter a sua localização...</small>
        </div>
        <div id="chat-log" class="chat-log"></div>
        <div id="chat-suggestions" class="chat-suggestions" style="display: none;">
            <strong>Sugestões:</strong>
            <ul id="suggestions-list"></ul>
        </div>
        <div class="chat-input-container">
            <input type="text" id="user-input" class="chat-input" placeholder="Ex.: Onde tem Paracetamol perto de mim?" onkeyup="handleEnter(event)">
            <button id="send-button" class="chat-button" onclick="sendMessage()">Enviar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
